name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  NODE_ENV: test
  AUTH_SECRET: testsecret_please_change
  NEXTAUTH_URL: http://localhost:3000
  RAZORPAY_KEY_ID: test_key
  RAZORPAY_KEY_SECRET: test_secret
  RAZORPAY_WEBHOOK_SECRET: test_webhook
  REDIS_URL: ""

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ganges_healers_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8-alpine
        ports: [ "55609:6379" ]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ganges_healers_test
      ALLOW_NET_CONNECT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
      - name: Verify isolated Redis outages and worker delivery
        timeout-minutes: 3
        env:
          QUEUE_TEST_REDIS_URL: redis://127.0.0.1:55609/15
        run: pnpm exec jest -c jest.config.ts --runInBand --testMatch '**/tests/operations/queues.redis.test.ts' --runTestsByPath tests/operations/queues.redis.test.ts

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated database rehearsal guards
        run: python3 -m unittest discover -s tests/operations -p 'test_*.py'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject high and critical production dependency advisories
        run: pnpm audit --prod --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: [unit, integration, ui, operations, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next

  e2e:
    timeout-minutes: 30
    needs: [build]
    # The locked Playwright release provides Chromium for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ganges_healers_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ganges_healers_test
      E2E_BASE_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu-hosted runners already provide the baseline Chromium libraries.
      # Avoid apt font-package fetching on every run: recent runners intermittently
      # fail to resolve azure.archive.ubuntu.com, before any browser test executes.
      - name: Install Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install chromium
      - name: Verify Chromium starts on the runner
        timeout-minutes: 2
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test')
          chromium.launch({ headless: true })
            .then(async browser => {
              const page = await browser.newPage()
              await page.goto('about:blank')
              await browser.close()
              console.log('Chromium launched successfully')
            })
            .catch(error => {
              console.error('Chromium could not launch with runner system libraries:', error)
              process.exitCode = 1
            })
          NODE
      - name: Run E2E
        run: pnpm test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: test-results/
          retention-days: 3
